name: Python Testing Roadmap CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test with coverage
        run: uv run pytest --cov=practice --cov-report=term-missing

      - name: Bandit
        run: uv run bandit -r practice phases/phase_10_security_testing

      - name: Dependency audit
        run: uv run pip-audit
