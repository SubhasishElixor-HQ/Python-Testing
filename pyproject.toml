[project]
name = "python-testing-roadmap"
version = "0.1.0"
description = "Phase-by-phase Python testing learning repository"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "locust>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["phases"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "smoke: critical build-readiness checks",
    "regression: checks for previously working behavior",
    "acceptance: checks against agreed requirements",
    "integration: tests requiring external services",
    "security: security-focused tests",
    "e2e: end-to-end tests",
    "performance: performance/load test examples",
]

[tool.ruff]
line-length = 88
target-version = "py311"
